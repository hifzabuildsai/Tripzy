name: M19.1 baseline bootstrap

on:
  push:
    branches:
      - m19-1-evals
    paths:
      - ".github/workflows/evals-bootstrap.yml"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --requirement requirements.lock
      - name: Generate v1.0.0 baseline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TRIPZY_SEARCH_MODE: replay
        run: |
          python -m evals.run             --suite all             --search-mode replay             --repeat 3             --concurrency 2             --output evals/reports/v1.0.0
      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m19-1-baseline-${{ github.run_id }}
          path: |
            evals/reports/v1.0.0.json
            evals/reports/v1.0.0.md
          if-no-files-found: error
