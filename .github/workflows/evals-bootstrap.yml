name: M19.1 baseline bootstrap

# Explicit only: normal pushes never consume inference quota.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Generate portfolio baseline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRIPZY_SEARCH_MODE: replay
        run: >-
          python -m evals.run --suite all --profile portfolio
          --search-mode replay --repeat 3 --concurrency 1 --request-interval 9
          --checkpoint evals/reports/portfolio-checkpoint.json
          --output evals/reports/v1.0.0-portfolio
      - name: Upload report and resumable checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m19-1-baseline-${{ github.run_id }}
          path: evals/reports/
          if-no-files-found: warn
