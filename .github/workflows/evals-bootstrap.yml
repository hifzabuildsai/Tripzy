name: M19.1 baseline bootstrap

on:
  push:
    branches:
      - m19-1-evals
    paths:
      - ".github/workflows/evals-bootstrap.yml"
      - "evals/run.py"

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --requirement requirements.lock

      - name: Generate v1.0.0 baseline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TRIPZY_SEARCH_MODE: replay
        run: |
          python -m evals.run --suite all --search-mode replay --repeat 3 --concurrency 1 --output evals/reports/v1.0.0

      - name: Commit baseline to milestone branch
        if: success()
        run: |
          cp evals/reports/v1.0.0.json evals/baselines/v1.0.0.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/baselines/v1.0.0.json
          git commit -m "test: record v1.0.0 eval baseline"
          git push origin HEAD:m19-1-evals

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m19-1-baseline-${{ github.run_id }}
          path: |
            evals/reports/v1.0.0.json
            evals/reports/v1.0.0.md
          if-no-files-found: warn
