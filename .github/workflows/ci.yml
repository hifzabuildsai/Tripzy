name: Release gate

# Validation only: this workflow never deploys Tripzy.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --requirement requirements.lock
          python -m pip install pytest==9.1.1 pip-audit==2.10.1
          python -m pip check

      - name: Test backend
        run: pytest -q

      - name: Audit backend dependencies
        run: python -m pip_audit --requirement requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_TRIPZY_API_URL: https://tripzy-api.example.com
        run: npm run build

      - name: Build backend image
        run: docker build --tag tripzy-backend:release-gate .

      - name: Verify backend image user
        run: |
          docker inspect --format='{{.Config.User}}' tripzy-backend:release-gate \
            | grep --fixed-strings --line-regexp tripzy

      - name: Start backend container
        run: |
          docker run --detach --rm --name tripzy-backend \
            --publish 8000:8000 \
            --env SUPABASE_URL=https://example.supabase.co \
            --env SUPABASE_KEY=ci-placeholder-key \
            tripzy-backend:release-gate

      - name: Verify running container is non-root
        run: test "$(docker exec tripzy-backend id -u)" = "10001"

      - name: Verify container health endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 20 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8000/health

      - name: Show container logs on failure
        if: failure()
        run: docker logs tripzy-backend || true

      - name: Stop backend container
        if: always()
        run: docker stop tripzy-backend || true
